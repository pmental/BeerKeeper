services:
  beerkeeper:
    build: .
    # Or, once you've published an image somewhere, swap the line above for:
    # image: yourname/beerkeeper:latest
    container_name: BeerKeeper
    restart: unless-stopped
    ports:
      - "${CELLAR_PORT:-8000}:8000"
    environment:
      - CELLAR_SECRET_KEY=${CELLAR_SECRET_KEY:?Set CELLAR_SECRET_KEY in your .env file - see .env.example}
      - CELLAR_DATA_DIR=/data
      - CELLAR_PASSWORD_AUTH_ENABLED=${CELLAR_PASSWORD_AUTH_ENABLED:-true}
      - CELLAR_OIDC_ENABLED=${CELLAR_OIDC_ENABLED:-false}
      - CELLAR_OIDC_ISSUER=${CELLAR_OIDC_ISSUER:-}
      - CELLAR_OIDC_CLIENT_ID=${CELLAR_OIDC_CLIENT_ID:-}
      - CELLAR_OIDC_CLIENT_SECRET=${CELLAR_OIDC_CLIENT_SECRET:-}
      - CELLAR_OIDC_SCOPES=${CELLAR_OIDC_SCOPES:-openid email profile}
      - CELLAR_OIDC_BUTTON_LABEL=${CELLAR_OIDC_BUTTON_LABEL:-Continue with SSO}
      - CELLAR_BASE_URL=${CELLAR_BASE_URL:-}
      - CELLAR_ADMIN_USERNAMES=${CELLAR_ADMIN_USERNAMES:-}
      - CELLAR_SMTP_HOST=${CELLAR_SMTP_HOST:-}
      - CELLAR_SMTP_PORT=${CELLAR_SMTP_PORT:-587}
      - CELLAR_SMTP_SECURITY=${CELLAR_SMTP_SECURITY:-starttls}
      - CELLAR_SMTP_USERNAME=${CELLAR_SMTP_USERNAME:-}
      - CELLAR_SMTP_PASSWORD=${CELLAR_SMTP_PASSWORD:-}
      - CELLAR_SMTP_FROM_EMAIL=${CELLAR_SMTP_FROM_EMAIL:-}
      - CELLAR_SMTP_FROM_NAME=${CELLAR_SMTP_FROM_NAME:-BeerKeeper}
      - CELLAR_SMTP_SKIP_CERT_VERIFY=${CELLAR_SMTP_SKIP_CERT_VERIFY:-false}
    volumes:
      - cellar-data:/data

volumes:
  cellar-data:
