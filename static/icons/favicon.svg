<svg xmlns="http://www.w3.org/2000/svg" viewBox="80 115 520 520">
  <defs>
    <linearGradient id="beerbody" x1="0" y1="0" x2="1" y2="0.3">
      <stop offset="0%" stop-color="#2a1508"/>
      <stop offset="12%" stop-color="#0a0604"/>
      <stop offset="55%" stop-color="#050302"/>
      <stop offset="88%" stop-color="#0a0604"/>
      <stop offset="100%" stop-color="#2a1508"/>
    </linearGradient>
    <linearGradient id="foam" x1="0" y1="1" x2="0" y2="0">
      <stop offset="0%" stop-color="#c98f4d"/>
      <stop offset="100%" stop-color="#e8c398"/>
    </linearGradient>
  </defs>

  <!-- glass + beer body: nonic-style silhouette -->
  <path d="M 200 150 C 185 165 178 195 195 230 L 185 260 C 150 320 155 420 190 480 L 195 620 L 485 620 L 490 480 C 525 420 530 320 495 260 L 485 230 C 502 195 495 165 480 150 C 460 130 220 130 200 150 Z"
        fill="url(#beerbody)" stroke="#8a5a25" stroke-width="3"/>

  <!-- foam cap: flattened, stays close to the glass rim's own width -->
  <path d="M 195 230 C 180 200 182 165 205 148 C 235 128 445 128 475 148 C 498 165 500 200 485 230
           C 470 245 440 255 400 258 C 370 260 320 262 280 258 C 245 255 210 245 195 230 Z"
        fill="url(#foam)"/>

  <!-- foam bubble texture -->
  <circle cx="240" cy="165" r="7" fill="#c98f4d" opacity="0.5"/>
  <circle cx="290" cy="150" r="8" fill="#c98f4d" opacity="0.5"/>
  <circle cx="340" cy="145" r="7" fill="#c98f4d" opacity="0.5"/>
  <circle cx="395" cy="148" r="6" fill="#c98f4d" opacity="0.5"/>
  <circle cx="440" cy="160" r="7" fill="#c98f4d" opacity="0.5"/>
  <circle cx="265" cy="190" r="6" fill="#c98f4d" opacity="0.45"/>
  <circle cx="320" cy="180" r="7" fill="#c98f4d" opacity="0.45"/>
  <circle cx="375" cy="185" r="6" fill="#c98f4d" opacity="0.45"/>
  <circle cx="420" cy="195" r="6" fill="#c98f4d" opacity="0.45"/>
  <circle cx="230" cy="215" r="5" fill="#c98f4d" opacity="0.4"/>
  <circle cx="330" cy="222" r="6" fill="#c98f4d" opacity="0.4"/>
  <circle cx="400" cy="218" r="5" fill="#c98f4d" opacity="0.4"/>
  <circle cx="300" cy="140" r="6" fill="#f6dcb8" opacity="0.75"/>
  <circle cx="360" cy="136" r="5" fill="#f6dcb8" opacity="0.7"/>
  <circle cx="245" cy="155" r="4" fill="#f6dcb8" opacity="0.65"/>

  <!-- glass rim line where foam meets the visible beer -->
  <rect x="195" y="230" width="290" height="28" fill="#c9974f" opacity="0.9"/>

  <!-- glass shine -->
  <rect x="205" y="235" width="26" height="360" fill="#ffffff" opacity="0.06"/>
  <rect x="445" y="235" width="22" height="360" fill="#ffffff" opacity="0.05"/>

  <!-- condensation droplets -->
  <g fill="#3a2a18" opacity="0.5">
    <circle cx="230" cy="310" r="7"/><circle cx="215" cy="360" r="5"/><circle cx="255" cy="400" r="9"/>
    <circle cx="200" cy="430" r="6"/><circle cx="270" cy="460" r="5"/><circle cx="225" cy="500" r="8"/>
    <circle cx="260" cy="540" r="6"/><circle cx="210" cy="570" r="5"/><circle cx="300" cy="330" r="6"/>
    <circle cx="330" cy="380" r="5"/><circle cx="310" cy="440" r="7"/><circle cx="350" cy="490" r="5"/>
    <circle cx="320" cy="530" r="6"/><circle cx="360" cy="560" r="5"/><circle cx="420" cy="320" r="6"/>
    <circle cx="450" cy="370" r="8"/><circle cx="405" cy="410" r="5"/><circle cx="460" cy="440" r="6"/>
    <circle cx="430" cy="480" r="5"/><circle cx="470" cy="520" r="7"/><circle cx="440" cy="560" r="5"/>
    <circle cx="380" cy="340" r="5"/><circle cx="390" cy="590" r="6"/><circle cx="250" cy="600" r="5"/>
  </g>
  <g fill="#e8c398" opacity="0.6">
    <circle cx="228" cy="308" r="2"/><circle cx="253" cy="398" r="2.5"/><circle cx="223" cy="498" r="2"/>
    <circle cx="308" cy="438" r="2"/><circle cx="448" cy="368" r="2.5"/><circle cx="468" cy="518" r="2"/>
    <circle cx="328" cy="378" r="1.5"/><circle cx="403" cy="408" r="1.5"/>
  </g>
</svg>
