<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>BeerKeeper</title>
  <script src="/assets/js/theme-init.js?v=__APP_VERSION__"></script>
  <link rel="stylesheet" href="/assets/css/style.css?v=__APP_VERSION__" />
  <link rel="icon" type="image/svg+xml" href="/assets/icons/favicon.svg?v=__APP_VERSION__" />
  <link rel="icon" type="image/png" sizes="32x32" href="/assets/icons/favicon-32.png?v=__APP_VERSION__" />
  <link rel="icon" type="image/png" sizes="16x16" href="/assets/icons/favicon-16.png?v=__APP_VERSION__" />
  <link rel="shortcut icon" href="/assets/icons/favicon.ico?v=__APP_VERSION__" />
  <link rel="apple-touch-icon" sizes="180x180" href="/assets/icons/apple-touch-icon.png?v=__APP_VERSION__" />
  <link rel="manifest" href="/assets/manifest.json?v=__APP_VERSION__" />
  <!-- iOS ignores the manifest's display mode and needs its own opt-in
       for a home-screen launch without browser chrome. Harmless
       elsewhere; every other platform reads display:standalone from the
       manifest instead. -->
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="BeerKeeper" />
  <meta name="theme-color" content="#16110c" />
</head>
<body>
  <div id="app">
    <header class="topbar">
      <a class="brand" href="#/">
        <span>Beer<span class="glow">Keeper</span></span>
        <span class="tag">self-hosted</span>
      </a>
      <button class="nav-toggle" id="nav-toggle" aria-label="Menu" aria-expanded="false" aria-controls="nav-links"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" aria-hidden="true"><line x1="3" y1="6" x2="21" y2="6"/><line x1="3" y1="12" x2="21" y2="12"/><line x1="3" y1="18" x2="21" y2="18"/></svg></button>
      <nav class="nav-links" id="nav-links"></nav>
      <div class="theme-picker">
        <label for="theme-select" class="sr-only">Theme</label>
        <select id="theme-select" class="theme-select">
          <option value="system">System</option>
          <option value="light">Light</option>
          <option value="dark">Dark</option>
        </select>
      </div>
      <div class="nav-right" id="nav-right"></div>
    </header>
    <main class="container" id="main"></main>
    <footer class="site-footer">
      A self-hosted cellar &amp; fridge tracker. Your data lives on your own server.
      &middot; <a href="https://github.com/pmental/BeerKeeper/releases" target="_blank" rel="noopener noreferrer" id="app-version-tag">BeerKeeper</a>
    </footer>
  </div>
  <div class="toast-wrap" id="toast-wrap"></div>

  <script src="/assets/js/theme.js?v=__APP_VERSION__"></script>
  <script src="/assets/js/api.js?v=__APP_VERSION__"></script>
  <script src="/assets/js/ui.js?v=__APP_VERSION__"></script>
  <script src="/assets/js/pages.js?v=__APP_VERSION__"></script>
  <script src="/assets/js/app.js?v=__APP_VERSION__"></script>
</body>
</html>
